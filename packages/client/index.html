<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оселя</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1712;
        color: #e8e0d0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 14px;
        background: rgba(20, 18, 14, 0.82);
        border: 1px solid rgba(200, 180, 140, 0.25);
        border-radius: 8px;
        font-size: 13px;
        letter-spacing: 0.02em;
        z-index: 10;
        pointer-events: none;
      }
      #status .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: middle;
        background: #b06840;
      }
      #status.connected .dot {
        background: #6fae57;
      }
      #status.connecting .dot {
        background: #d0a84a;
      }

      /* Top resource HUD */
      #resource-bar {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 160px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        z-index: 10;
        pointer-events: none;
      }
      #resource-bar .chip {
        background: rgba(20, 18, 14, 0.82);
        border: 1px solid rgba(200, 180, 140, 0.22);
        border-radius: 7px;
        padding: 6px 10px;
        font-size: 12px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #resource-bar .chip b {
        font-weight: 600;
        color: #c9b995;
        margin-right: 4px;
        font-size: 11px;
      }
      #resource-bar .chip.season {
        background: rgba(60, 50, 30, 0.86);
        color: #ecd9a6;
      }

      /* Bottom build panel */
      #build-panel {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        padding: 8px;
        background: rgba(20, 18, 14, 0.86);
        border: 1px solid rgba(200, 180, 140, 0.22);
        border-radius: 12px;
        z-index: 10;
      }
      .build-card {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-width: 92px;
        padding: 8px 10px;
        background: rgba(45, 40, 30, 0.9);
        border: 1px solid rgba(200, 180, 140, 0.2);
        border-radius: 8px;
        color: #e8e0d0;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      .build-card:hover {
        background: rgba(70, 60, 44, 0.95);
      }
      .build-card.active {
        border-color: #d0a84a;
        background: rgba(90, 74, 40, 0.95);
      }
      .build-card .name {
        font-size: 12px;
        font-weight: 600;
      }
      .build-card .cost {
        font-size: 10px;
        color: #b7a988;
      }

      /* Building inspect / worker slider */
      #building-panel {
        position: fixed;
        right: 12px;
        bottom: 14px;
        width: 220px;
        padding: 12px 14px;
        background: rgba(20, 18, 14, 0.9);
        border: 1px solid rgba(200, 180, 140, 0.25);
        border-radius: 10px;
        z-index: 11;
        font-size: 13px;
      }
      #building-panel h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #ecd9a6;
      }
      #building-panel .row {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        color: #c8bda0;
        font-size: 12px;
      }
      #building-panel input[type="range"] {
        width: 100%;
        margin-top: 6px;
      }
      #building-panel .actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }
      #building-panel button {
        flex: 1;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid rgba(200, 180, 140, 0.25);
        background: rgba(60, 50, 34, 0.9);
        color: #e8e0d0;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      #building-panel button.demolish {
        background: rgba(90, 45, 38, 0.9);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"><span class="dot"></span><span id="status-text">З'єднання…</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
