<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оселя</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1712;
        color: #e8e0d0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 14px;
        background: rgba(20, 18, 14, 0.82);
        border: 1px solid rgba(200, 180, 140, 0.25);
        border-radius: 8px;
        font-size: 13px;
        letter-spacing: 0.02em;
        z-index: 10;
        pointer-events: none;
      }
      #status .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: middle;
        background: #b06840;
      }
      #status.connected .dot {
        background: #6fae57;
      }
      #status.connecting .dot {
        background: #d0a84a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status"><span class="dot"></span><span id="status-text">З'єднання…</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
